name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: GUI and automated runner checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13.3'

      - name: Check Python syntax and Tkinter availability
        run: |
          python -m compileall -q src tests
          python -c "import tkinter; print('Tkinter available; GUI tests run without a display.')"

      - name: Run automated tests
        run: python -m unittest tests.test_gui tests.test_automated_runner -v

      - name: Generate runner demo evidence
        if: ${{ !cancelled() }}
        run: python -m src.testing --output-dir test-evidence

      - name: Upload runner demo evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: runner-demo-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
